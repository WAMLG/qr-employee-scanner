<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunch QR — Camera Test</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#0c1728;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:720px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.4rem;margin:8px 0}small,.muted{color:#aebdd1}.pill{font-size:.75rem;border:1px solid #50617a;border-radius:30px;padding:6px 10px}section{background:#17263b;border:1px solid #30435d;border-radius:16px;padding:14px;margin-top:14px}#reader{width:100%;min-height:230px;overflow:hidden;border-radius:12px;background:#02070e}#reader video{object-fit:cover}button,select{background:#243b56;border:1px solid #5a708c;color:#fff;padding:12px;border-radius:10px;font:inherit;min-height:46px}button.primary{background:#176a4b;border-color:#3ca37b}button:disabled{opacity:.45}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls>*{flex:1}label{display:block;margin:10px 0 5px}select{width:100%}#result{font-size:1.1rem;font-weight:650;min-height:68px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;background:#263950;border-radius:12px}#result.ok{background:#104632}#result.warn{background:#59421c}#result.err{background:#5d2626}#log{list-style:none;padding:0;margin:0;max-height:250px;overflow:auto}#log li{padding:9px 0;border-bottom:1px solid #33445c;overflow-wrap:anywhere}input[type=range]{width:100%}.hint{font-size:.88rem;line-height:1.5}#reader__dashboard_section_csr{display:none!important}
</style>
</head>
<body>
<header><div><h1>Lunch QR Scanner</h1><small>Camera test · no lunch requests submitted</small></div><span class="pill" id="state">Stopped</span></header>
<section><div id="reader"></div><p class="hint">For small printed codes, hold the card steady, fill more of the camera view with the QR, and avoid glare. Try zoom if your camera supports it.</p><label for="camera">Camera</label><select id="camera"><option value="">Automatic rear camera</option></select><div class="controls" style="margin-top:12px"><button id="start" class="primary">Start scanning</button><button id="stop" disabled>Stop</button><button id="torch" disabled>Flashlight</button></div><div id="zoomBox" hidden><label for="zoom">Camera zoom: <span id="zoomValue"></span></label><input type="range" id="zoom" step="0.1"></div></section>
<section><div id="result" role="status" aria-live="polite">Ready to test QR detection</div><p class="muted" id="counter">Unique detections: 0</p></section>
<section><h2 style="font-size:1.1rem">Recent scans</h2><ul id="log"></ul><button id="clear">Clear test history</button></section>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let scanner=null, running=false, torchOn=false, lastValue='', lastAt=0, uniqueCount=0, busy=false;
const recent=[];
function state(t){$('state').textContent=t;}
function feedback(text,kind=''){const el=$('result');el.textContent=text;el.className=kind;}
function sound(){try{const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;const ctx=new AudioContextClass();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=850;gain.gain.value=.06;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.1);osc.onended=()=>ctx.close();}catch(e){}}
function onScan(value){const id=String(value||'').trim();if(!id)return;const now=Date.now();if(id===lastValue&&now-lastAt<5000)return;lastValue=id;lastAt=now;uniqueCount++;$('counter').textContent='Detections: '+uniqueCount;feedback('Detected QR: '+id,'ok');sound();if(navigator.vibrate)navigator.vibrate(70);const li=document.createElement('li');li.textContent=new Date().toLocaleTimeString()+' — '+id; $('log').prepend(li);while($('log').children.length>20)$('log').lastChild.remove();}
async function listCameras(){try{const cams=await Html5Qrcode.getCameras();const sel=$('camera'),previous=sel.value;sel.innerHTML='<option value="">Automatic rear camera</option>';cams.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.label||'Camera '+(sel.length);sel.append(op);});if([...sel.options].some(o=>o.value===previous))sel.value=previous;}catch(e){/* camera enumeration may require permission */}}
async function capabilities(){ $('torch').disabled=true;$('zoomBox').hidden=true;try{const track=scanner.getRunningTrack();if(!track)return;const caps=track.getCapabilities?.()||{};if(caps.torch)$('torch').disabled=false;if(caps.zoom&&Number.isFinite(caps.zoom.min)&&Number.isFinite(caps.zoom.max)){const z=$('zoom');z.min=caps.zoom.min;z.max=caps.zoom.max;z.step=caps.zoom.step||.1;z.value=track.getSettings?.().zoom||caps.zoom.min;$('zoomValue').textContent=z.value;$('zoomBox').hidden=false;}}catch(e){}}
async function start(){if(busy||running)return;busy=true;$('start').disabled=true;feedback('Opening camera…');try{if(!window.Html5Qrcode)throw new Error('Scanner library failed to load. Check your internet connection.');scanner=new Html5Qrcode('reader',{verbose:false});const chosen=$('camera').value;const camera=chosen?{deviceId:{exact:chosen}}:{facingMode:'environment'};await scanner.start(camera,{fps:12,videoConstraints:chosen?{deviceId:{exact:chosen},width:{ideal:1920},height:{ideal:1080}}:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},qrbox:(w,h)=>{const size=Math.floor(Math.min(w,h)*.85);return {width:Math.max(120,size),height:Math.max(120,size)};}},onScan,()=>{});running=true;state('Scanning');$('stop').disabled=false;feedback('Camera ready — show an employee QR');await listCameras();await capabilities();}catch(e){feedback('Camera error: '+(e?.message||e),'err');state('Error');if(scanner){try{await scanner.clear();}catch(_){ }scanner=null;}}finally{busy=false;$('start').disabled=running;}}
async function stop(){if(busy||!running)return;busy=true;$('stop').disabled=true;try{await scanner.stop();await scanner.clear();}catch(e){feedback('Stop error: '+e.message,'err');}finally{scanner=null;running=false;torchOn=false;busy=false;$('start').disabled=false;$('torch').disabled=true;$('zoomBox').hidden=true;state('Stopped');}}
$('start').onclick=start;$('stop').onclick=stop;$('clear').onclick=()=>{$('log').replaceChildren();uniqueCount=0;$('counter').textContent='Detections: 0';feedback('Test history cleared');};$('camera').onchange=async()=>{if(running){await stop();await start();}};
$('torch').onclick=async()=>{try{torchOn=!torchOn;await scanner.applyVideoConstraints({advanced:[{torch:torchOn}]});$('torch').textContent=torchOn?'Flashlight off':'Flashlight';}catch(e){torchOn=false;feedback('Flashlight unavailable on this camera','warn');}};
$('zoom').oninput=async()=>{try{const val=Number($('zoom').value);await scanner.applyVideoConstraints({advanced:[{zoom:val}]});$('zoomValue').textContent=String(val);}catch(e){feedback('Zoom unavailable on this camera','warn');}};
listCameras();
</script>
</body></html>
